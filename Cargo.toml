[package]
name = "rust_iced_helloworld"
version = "0.1.1"
edition = "2021"
description = "A tour of Iced 0.13 features, tuned for macOS (Apple Silicon)"
license = "MIT"          
repository = "https://github.com/JordanNash/rust_iced_helloworld"
publish = false

[dependencies]
# Everything below is relevant to a native macOS (Apple Silicon) build.
# Left out on purpose: tiny-skia (software renderer), webgl, fira-sans (Wasm
# font), async-std/smol (alternate executors), multi-window (experimental; needs the daemon API).
iced = { version = "0.13", default-features = false, features = [
    "wgpu",                  # GPU renderer (Metal on macOS)
    "tokio",                 # async runtime + time::every subscriptions
    "canvas",                # 2D drawing
    "image-without-codecs",  # Image widget for raw pixels (no PNG/JPEG decoders; use "image" if you load files)
    "svg",                   # SVG widget
    "qr_code",               # QR code widget
    "markdown",              # Markdown rendering widget
    "lazy",                  # Lazy (cached) widgets
    "highlighter",           # Syntax highlighting for text_editor (adds syntect: grows the binary)
    "debug",                 # F12 debug/performance overlay
    "system",                # Query system information
    "auto-detect-theme",     # Theme::default() follows macOS light/dark mode
] }
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = "z"     # optimize for size instead of speed
lto = true          # link-time optimization across all crates
codegen-units = 1   # slower build, smaller output
panic = "abort"     # drops the unwinding machinery
strip = true        # removes symbols

# NIGHTLY BUILD OPTIMIZATION
# rustup toolchain install nightly
# rustup component add rust-src --toolchain nightly
# cargo +nightly build --release -Zbuild-std : 2.5 MB (nightly) from 2.7 MB (stable)

